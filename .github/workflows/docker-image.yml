name: MultiShop CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Increase vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Create CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=multi_shop_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          SECRET_KEY=ci-test-secret-key
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1,backend,testserver
          BACKEND_PORT=8000
          EMAIL_HOST=smtp4dev
          EMAIL_PORT=25
          EMAIL_USE_TLS=False
          EMAIL_HOST_USER=
          EMAIL_HOST_PASSWORD=
          DEFAULT_FROM_EMAIL=no-reply@example.com
          SMTP4DEV_WEB_PORT=5001
          SMTP4DEV_SMTP_PORT=25
          SMTP4DEV_IMAP_PORT=143
          CELERY_TIMEZONE=Asia/Tehran
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          N8N_PORT=8900
          N8N_BASIC_AUTH_USER=admin
          N8N_BASIC_AUTH_PASSWORD=ci-test-password
          ELASTICSEARCH_HOST=elasticsearch
          ELASTICSEARCH_PORT=9200
          ELASTICSEARCH_MEMORY=700MB
          KIBANA_PORT=5601
          LOGSTASH_BEATS_PORT=5044
          LOGSTASH_TCP_PORT=5002
          LOGSTASH_MONITORING_PORT=9600
          LOCUST_PORT=8009
          EOF

      - name: Show .env (debug)
        run: cat .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build backend

      - name: Start database, Redis, and Elasticsearch
        run: docker compose up -d db redis elasticsearch

      - name: Show running containers
        run: docker compose ps

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres -d multi_shop_db; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          docker compose logs --no-color db
          exit 1

      - name: Wait for Redis
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done
          echo "Redis did not become ready in time"
          docker compose logs --no-color redis
          exit 1

      - name: Wait for Elasticsearch
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "Elasticsearch is ready"
              exit 0
            fi
            echo "Waiting for Elasticsearch... ($i/60)"
            sleep 2
          done
          echo "Elasticsearch did not become ready in time"
          docker compose logs --no-color elasticsearch
          exit 1

      - name: Start backend
        run: docker compose up -d backend

      - name: Wait for backend startup
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T backend python -c "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()" 2>/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become ready in time"
          docker compose logs --no-color backend
          exit 1

      - name: Run Django migrations
        run: docker compose exec -T backend python manage.py migrate --noinput

      - name: Collect tests
        run: docker compose exec -T backend pytest --collect-only -q

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          docker compose exec -T backend pytest -v --tb=long --color=no 2>&1 | tee pytest.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color db redis elasticsearch backend

      - name: Stop services
        if: always()
        run: docker compose down -v
