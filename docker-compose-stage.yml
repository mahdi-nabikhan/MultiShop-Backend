
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 200m

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    mem_limit: 100m

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn Multi_Shop.wsgi --bind 0.0.0.0:8000
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      # سایر متغیرهای ضروری Django را نیز اینجا اضافه می‌کنیم.
    depends_on:
      - db
      - redis
    mem_limit: 300m

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: celery -A Multi_Shop worker --loglevel=info
    depends_on:
      - redis
      - backend
    mem_limit: 256m


# =================================
# ELASTICSEARCH
# =================================
  elasticsearch:
    image: mirror2.chabokan.net/elasticsearch:8.17.0
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    restart: unless-stopped

    mem_limit: ${ELASTICSEARCH_MEMORY}

volumes:
  postgres_data:
  static_volume:
  media_volume:
  elasticsearch_data: