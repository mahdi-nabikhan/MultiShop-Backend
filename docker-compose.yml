services:

# =================================
# POSTGRESQL
# =================================
  db:
    image: postgres:17
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    mem_limit: 200MB


# =================================
# REDIS
# =================================
  redis:
    container_name: redis
    image: redis:7

    ports:
      - "${REDIS_PORT}:6379"

    command: redis-server --save 60 1 --loglevel warning

    mem_limit: 100MB


# =================================
# BACKEND
# =================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend

    container_name: backend

    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

    volumes:
      - ./src/backend:/app

    ports:
      - "${BACKEND_PORT}:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

    mem_limit: 300MB


# =================================
# SMTP4DEV  (heavy — فقط با profile)
# =================================
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: smtp4dev
    restart: always
    profiles: ["heavy"]

    ports:
      - "${SMTP4DEV_WEB_PORT}:80"
      - "${SMTP4DEV_SMTP_PORT}:25"
      - "${SMTP4DEV_IMAP_PORT}:143"

    volumes:
      - smtp4dev-data:/smtp4dev

    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

    mem_limit: 100MB


# =================================
# Celery Workers
# =================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend

    command: celery -A Multi_Shop worker --loglevel=info

    env_file:
      - .env

    depends_on:
      - redis
      - backend

    volumes:
      - ./src/backend:/app

    mem_limit: 256MB


# =================================
# n8n
# =================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n

    ports:
      - "${N8N_PORT}:4388"

    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_HOST=0.0.0.0
      - N8N_PORT=4388

    volumes:
      - ./n8n_data:/home/node/.n8n

    depends_on:
      - redis
      - backend

    mem_limit: 255MB


# =================================
# ELASTICSEARCH
# =================================
  elasticsearch:
    image: mirror2.chabokan.net/elasticsearch:8.17.0
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    restart: unless-stopped

    mem_limit: ${ELASTICSEARCH_MEMORY}


# =================================
# ELK STACK (KIBANA)  — heavy
# =================================
  kibana:
    image: mirror2.chabokan.net/elastic/kibana:8.17.0
    container_name: kibana
    profiles: ["heavy"]

    depends_on:
      - elasticsearch

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "${KIBANA_PORT}:5601"

    restart: unless-stopped

    mem_limit: 350MB


# =================================
# ELK STACK (LOGSTASH)  — heavy
# =================================
  logstash:
    image: mirror2.chabokan.net/logstash:8.17.0
    container_name: logstash
    profiles: ["heavy"]

    depends_on:
      - elasticsearch

    ports:
      - "${LOGSTASH_BEATS_PORT}:5044"
      - "${LOGSTASH_TCP_PORT}:5001"
      - "${LOGSTASH_MONITORING_PORT}:9600"

    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline

    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m

    restart: unless-stopped

    mem_limit: 284MB


# ======================================
# Load Testing  — heavy
# ======================================
  master:
    image: locustio/locust
    profiles: ["heavy"]

    ports:
      - "${LOCUST_PORT}:8009"

    volumes:
      - ./Multi_Shop/locust:/mnt/locust

    command: -f /mnt/locust/locustfile.py --master -H http://backend:8000


  locust_worker:
    image: locustio/locust
    profiles: ["heavy"]

    volumes:
      - ./Multi_Shop/locust:/mnt/locust

    command: -f /mnt/locust/locustfile.py --worker --master-host master


volumes:
  smtp4dev-data:
  esdata:
  postgres_data:
  elasticsearch_data: